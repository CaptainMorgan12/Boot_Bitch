name: Bug report
description: Report a problem with Boot Bitch
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: >-
        Please describe the problem in one short paragraph: (1) the Boot Bitch
        version you ran, (2) the affected distribution and release, (3) the
        behavior you saw, and (4) the tool's session log — exported from the
        Logs tab (Save As…) or the log file under the application's log
        directory — attached or pasted.
    validations:
      required: true
